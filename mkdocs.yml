site_name: Eloquent Notes
site_description: Lightweight, system-tray-centric utility for Linux dictation into Obsidian powered by Gemma 4 via Ollama.
site_author: Arrase
site_url: https://arrase.github.io/eloquent-notes/

repo_name: arrase/eloquent-notes
repo_url: https://github.com/arrase/eloquent-notes

nav:
  - Overview: index.md
  - Architecture & Design: architecture.md
  - Three-Phase AI Pipeline: pipeline.md
  - Obsidian Vault Integration: obsidian.md
  - Configuration & Templates: configuration.md
  - System Tray & Shortcuts: usage-shortcuts.md
  - CLI & Logging: cli.md
  - Installation & Setup: installation.md

theme:
  name: material
  language: en
  icon:
    logo: material/microphone
  palette:
    # Palette toggle for light/dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy

plugins: []

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arrase/eloquent-notes
