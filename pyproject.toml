[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eloquent-notes"
version = "0.4.3"
description = "A Linux system tray utility that turns offline voice dictations into organized Markdown notes using Gemma 4."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Eloquent Notes Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "sounddevice>=0.5.5",
    "numpy>=2.5.1",
    "PyQt6>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
eloquent-notes = "eloquent_notes.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "eloquent-notes[test]",
    "ruff>=0.16.7",
    "mypy>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eloquent_notes*"]

[tool.setuptools.package-data]
eloquent_notes = [
    "config.yaml",
    "prompts/*.md",
    "locales/*.pot",
    "locales/*/LC_MESSAGES/*.po",
    "locales/*/LC_MESSAGES/*.mo",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
]
ignore = [
    # Design-metric rules: thresholds are arbitrary and would force artificial splits.
    "PLR0911", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # Module-level runtime state is intentional.
    "PLW0603",
    # Cheap path metadata calls (resolve/exists) in async handlers are not worth offloading to threads.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# PyQt6 event handler method names are camelCase by framework convention.
"eloquent_notes/config_gui/dialog.py" = ["N802"]
"eloquent_notes/recording_hud.py" = ["N802"]
"eloquent_notes/window.py" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["eloquent_notes"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
