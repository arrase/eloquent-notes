[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eloquent-notes"
version = "0.6.0"
description = "A Linux system tray utility that turns offline voice dictations into organized Markdown notes using Gemma 4."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Eloquent Notes Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "sounddevice>=0.5.5",
    "numpy>=2.5.1",
    "PyQt6>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "silero-vad-lite>=0.4.0",
]

[project.scripts]
eloquent-notes = "eloquent_notes.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "eloquent-notes[test]",
    "ruff>=0.16.7",
    "mypy>=1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eloquent_notes*"]

[tool.setuptools.package-data]
eloquent_notes = [
    "config.yaml",
    "prompts/*.md",
    "locales/*.pot",
    "locales/*/LC_MESSAGES/*.po",
    "locales/*/LC_MESSAGES/*.mo",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
    "C90", "BLE", "TRY", "RSE", "ARG", "ERA", "FIX", "TD", "FURB", "PGH", "SLF",
    "FBT", "DTZ", "PT", "ANN",
]
ignore = [
    # Module-level runtime state is intentional.
    "PLW0603",
    # Cheap path metadata calls (resolve/exists) in async handlers are not worth offloading to threads.
    "ASYNC240",
    # Descriptive messages in standard exceptions are idiomatic without custom exception subclasses.
    "TRY003",
    # ValueError is the uniform domain validation error for persisted YAML and config payloads.
    "TRY004",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 11
max-positional-args = 5

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "PLR2004", "PT011"]
# PyQt6 event handler method names are camelCase by framework convention.
"eloquent_notes/config_gui/dialog.py" = ["N802"]
"eloquent_notes/recording_hud.py" = ["N802"]
"eloquent_notes/window.py" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["eloquent_notes"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

# PyQt6 6.12.0 ships a malformed QtGui.pyi stub ('/' placed after '*args').
[[tool.mypy.overrides]]
module = ["PyQt6.QtGui"]
follow_imports = "skip"
follow_imports_for_stubs = true

# PyQt6 stubs type non-null Qt C++ pointers and initialized lifecycle attributes as Optional.
[[tool.mypy.overrides]]
module = ["eloquent_notes.app", "eloquent_notes.window", "eloquent_notes.config_gui.tabs.text_files"]
disable_error_code = ["union-attr"]
