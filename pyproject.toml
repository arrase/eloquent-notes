[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eloquent-notes"
version = "0.2.8"
description = "A Linux system tray utility for offline dictation into Obsidian using Gemma 4."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Eloquent Notes Developers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "sounddevice>=0.5.5",
    "numpy>=2.5.1",
    "PyQt6>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
eloquent-notes = "eloquent_notes.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.7",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eloquent_notes*"]

[tool.setuptools.package-data]
eloquent_notes = ["config.yaml", "prompts/*.md", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["eloquent_notes"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
